name: Build Cronet (Linux x64)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Chromium fork branch or commit
        required: true
        default: hray/157.0.8103.14

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          filter: blob:none
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chrome/VERSION
            /net/
            /components/hray_native/
      - name: Prepare release sources
        run: |
          set -euo pipefail
          mkdir logs
          bash automation/tools/prepare-source.sh source "$RUNNER_TEMP/chromium" 2>&1 | tee logs/source.log
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libnss3-dev
          python3 -m pip install requests
      - name: Build and check ABI
        run: |
          set -euo pipefail
          nproc
          free -m
          bash automation/tools/build-linux.sh "$RUNNER_TEMP/chromium" 2>&1 | tee logs/build.log
      - name: Collect build conditions
        if: always()
        run: |
          mkdir -p logs
          git -C automation rev-parse HEAD > logs/AUTOMATION_REVISION
          git -C source rev-parse HEAD > logs/SOURCE_REVISION
          cp source/chrome/VERSION logs/
          if [ -f "$RUNNER_TEMP/chromium/out/Release/args.gn" ]; then
            cp "$RUNNER_TEMP/chromium/out/Release/args.gn" logs/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-linux-x64
          path: logs/
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64
          path: ${{ runner.temp }}/chromium/out/Release/cronet/
          if-no-files-found: error
