name: Build Cronet
on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, cpu: x64}
          - {runner: ubuntu-24.04, os: linux, cpu: arm64}
          - {runner: windows-2025, os: win, cpu: x64}
          - {runner: windows-2025, os: win, cpu: arm64}
          - {runner: ubuntu-24.04, os: android, cpu: arm64}
          - {runner: ubuntu-24.04, os: android, cpu: arm}
          - {runner: ubuntu-24.04, os: android, cpu: x64}
          - {runner: ubuntu-24.04, os: android, cpu: x86}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: src
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.cpu }}" target_os="${{ matrix.os }}"'
      JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bubblewrap
          python3 -m pip install requests
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python3 -m pip install ninja
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build
            src/third_party/android_toolchain
            src/gn
            src/third_party/rust-toolchain
            src/out/sysroot-build
          key: cronet-${{ runner.os }}-${{ matrix.os }}-${{ matrix.cpu }}-${{ hashFiles('CHROMIUM_VERSION', 'src/get-clang.sh', 'src/tools/rust/update_rust.py') }}
      - run: ./get-clang.sh
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-${{ matrix.os }}-${{ matrix.cpu }}
          path: src/out/Release/cronet/
          if-no-files-found: error
