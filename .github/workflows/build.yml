name: Build Cronet
on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cronet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage and patch Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          python3 tools/stage-upstream.py "$(cat CHROMIUM_VERSION)" "$RUNNER_TEMP/chromium-stage" 2>&1 | tee ci-logs/stage.log
          python3 tools/apply-upstream-patches.py "$RUNNER_TEMP/chromium-stage" 2>&1 | tee ci-logs/patches.log
          tar -C "$RUNNER_TEMP/chromium-stage" -cf "$RUNNER_TEMP/chromium-source.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-source
          path: ${{ runner.temp }}/chromium-source.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-preparation-logs
          path: ci-logs/

  build:
    needs: prepare
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, cpu: x64}
          - {runner: ubuntu-24.04, os: linux, cpu: arm64}
          - {runner: windows-2025, os: win, cpu: x64}
          - {runner: windows-2025, os: win, cpu: arm64}
          - {runner: ubuntu-24.04, os: android, cpu: arm64}
          - {runner: ubuntu-24.04, os: android, cpu: arm}
          - {runner: ubuntu-24.04, os: android, cpu: x64}
          - {runner: ubuntu-24.04, os: android, cpu: x86}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: src
    env:
      EXTRA_FLAGS: 'target_cpu="${{ matrix.cpu }}" target_os="${{ matrix.os }}"'
      JOBS: 2
      THIN_LTO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: chromium-source
          path: ${{ runner.temp }}/chromium-source
      - name: Install prepared source
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p ci-logs "$RUNNER_TEMP/chromium-stage"
          tar -xf "$RUNNER_TEMP/chromium-source/chromium-source.tar" -C "$RUNNER_TEMP/chromium-stage"
          python3 tools/install-upstream.py "$RUNNER_TEMP/chromium-stage" 2>&1 | tee ci-logs/install.log
          rm -rf "$RUNNER_TEMP/chromium-stage" "$RUNNER_TEMP/chromium-source"
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bubblewrap
          python3 -m pip install requests
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python3 -m pip install ninja
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            src/third_party/llvm-build
            src/third_party/android_toolchain
            src/gn
            src/third_party/rust-toolchain
            src/out/sysroot-build
          key: cronet-${{ runner.os }}-${{ matrix.os }}-${{ matrix.cpu }}-${{ hashFiles('CHROMIUM_VERSION', 'src/get-clang.sh', 'src/tools/rust/update_rust.py') }}
      - name: Install matching toolchains
        run: |
          set -euo pipefail
          ./get-clang.sh 2>&1 | tee ../ci-logs/toolchains.log
      - name: Configure native library
        run: |
          set -euo pipefail
          ./build.sh configure 2>&1 | tee ../ci-logs/configure.log
      - name: Build and bundle
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee ../ci-logs/build.log
      - name: Collect build conditions
        if: always()
        working-directory: .
        run: |
          mkdir -p ci-logs
          git rev-parse HEAD > ci-logs/revision.txt
          cp CHROMIUM_VERSION ci-logs/
          cp tools/patches/series ci-logs/patch-series.txt
          if [ -f src/out/Release/args.gn ]; then cp src/out/Release/args.gn ci-logs/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}-${{ matrix.cpu }}
          path: ci-logs/
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-${{ matrix.os }}-${{ matrix.cpu }}
          path: src/out/Release/cronet/
          if-no-files-found: error
